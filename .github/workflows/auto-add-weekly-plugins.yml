name: Auto Add New Weekly Plugins (dotfyle, Reddit, awesome-neovim)

on:
  schedule:
    - cron: "0 9 * * 6"
  workflow_dispatch:

jobs:
  add-plugins:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync

      - name: Cache Codex workspace
        uses: actions/cache@v6
        with:
          path: |
            ~/.codex
            !~/.codex/auth.json
          key: codex-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            codex-${{ runner.os }}-

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Setup Codex authentication
        run: |
          mkdir -p ~/.codex
          echo '${{ secrets.CODEX_AUTH }}' > ~/.codex/auth.json

      - name: Configure Codex trust
        run: |
          cat > ~/.codex/config.toml << 'EOF'
          [projects."${{ github.workspace }}"]
          trust_level = "trusted"
          EOF

      - name: Fetch new plugins from dotfyle RSS
        run: uv run scripts/fetch_dotfyle_rss.py .latest_rss.json

      - name: Show fetched RSS data
        run: cat .latest_rss.json

      - name: Fetch new plugins from Reddit
        run: |
          # Reddit rejects requests without a browser-like User-Agent.
          if ! curl -fsSL \
            -H 'User-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:140.0) Gecko/20100101 Firefox/140.0' \
            -H 'Accept: application/atom+xml,application/rss+xml;q=0.9,application/xml;q=0.7,*/*;q=0.1' \
            -H 'Accept-Language: en-US,en;q=0.5' \
            'https://www.reddit.com/r/neovim/search.rss?q=flair%3APlugin&restrict_sr=on&type=link&sort=new' \
            -o .reddit_rss.xml; then
            echo "::warning::Failed to fetch Reddit RSS. Continuing with dotfyle only."
            : > .reddit_rss.xml
          fi
          grep -oE 'https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' .reddit_rss.xml \
            | sed -e 's|https://github\.com/||' -e 's|\.git$||' -e 's|\.$||' \
            | sort -u > .reddit_repos.txt || true
          cat .reddit_repos.txt

      - name: Fetch new plugins from awesome-neovim PRs
        run: |
          if ! gh pr list -R rockerBOO/awesome-neovim \
            --state all --limit 200 \
            --search "created:>=$(date -u -d '7 days ago' +%F) sort:created-desc" \
            --json number,title,body,url \
            --jq '.[]
                  | select(.title | test("^\\s*Add"; "i"))
                  | (.title + "\n" + (.body // ""))
                  | [match("https://github\\.com/[A-Za-z0-9][\\w.-]*/[A-Za-z0-9][\\w.-]*"; "g").string]
                  | .[]' > .awesome_urls.txt; then
            echo "::warning::Failed to fetch awesome-neovim PRs. Continuing without them."
            : > .awesome_urls.txt
          fi
          sed -E -e 's/[.,)]+$//' -e 's|^https://github\.com/||' -e 's/\.git$//' .awesome_urls.txt \
            | grep -Ev '^(sponsors|orgs|topics|features|apps|marketplace|collections|users)/' \
            | grep -vxF 'rockerBOO/awesome-neovim' \
            | sort -u > .awesome_repos.txt || true
          cat .awesome_repos.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filter out starred or already listed plugins
        run: |
          { jq -r '.[].title' .latest_rss.json; cat .reddit_repos.txt .awesome_repos.txt; } | sort -u > .candidate_repos.txt
          : > .new_plugins.txt
          for repo in $(cat .candidate_repos.txt); do
            if gh api "user/starred/${repo}" --silent 2>/dev/null; then
              echo "Skip ${repo}: already starred"
              continue
            fi
            if grep -qiF "github.com/${repo})" ./*.md; then
              echo "Skip ${repo}: already listed"
              continue
            fi
            echo "https://github.com/${repo}" >> .new_plugins.txt
          done
          cat .new_plugins.txt
        env:
          # The starred check must run as the list owner, not the Actions bot.
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Check for new plugins
        id: check_plugins
        run: |
          count=$(grep -c . .new_plugins.txt || true)
          echo "plugin_count=$count" >> $GITHUB_OUTPUT
          if [ "$count" -eq 0 ]; then
            echo "No new plugins found this week. Skipping."
          fi

      - name: Categorize plugins with Codex
        if: steps.check_plugins.outputs.plugin_count != '0'
        run: |
          codex -m gpt-6-astra --ask-for-approval never exec --sandbox danger-full-access '$add'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check categorization result
        if: steps.check_plugins.outputs.plugin_count != '0'
        id: check_result
        run: |
          if [ -f ".reason.md" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo ".reason.md does not exist. No plugins were categorized."
          fi

      - name: Update SECTION.md
        if: steps.check_plugins.outputs.plugin_count != '0' && steps.check_result.outputs.exists == 'true'
        run: ./scripts/extract-sections.sh

      - name: Create Pull Request
        if: steps.check_plugins.outputs.plugin_count != '0' && steps.check_result.outputs.exists == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git checkout -b ai-weekly-${{ github.run_id }}
            git add *.md .codex/skills/add/references/SECTION.md
            git commit -m "Add"
            git push origin ai-weekly-${{ github.run_id }}
            gh pr create \
              --title "Add" \
              --body-file ".reason.md" \
              --base main \
              --head ai-weekly-${{ github.run_id }} \
              --assignee yutkat \
              --label "automated pr,bot"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh Codex authentication
        if: always()
        run: |
          if [ -f ~/.codex/auth.json ]; then
            gh secret set CODEX_AUTH -R "${{ github.repository }}" -b"$(cat ~/.codex/auth.json)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
